[workspace]
members = [
    "crates/learn-core",
    "crates/learn-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
rand = "0.8"
ureq = { version = "2.10", features = ["json"] }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
